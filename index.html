<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F.O.C.O. - Segundo Cerebro Visual</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configuración oficial de Tailwind para F.O.C.O. -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            foco: {
              // Paleta de colores institucional para FOCO
              blue: {
                deep: '#22298A',       // Azul institucional (Headers, logos, botones)
                accent: '#7C83DE',     // Color de las Notas
                mid: '#5966B2',       // Color de las Tareas
                light: '#C6C9F1',        // Color de las Listas
                gray: '#DDE2F2',      // Fondo gris azulado del lienzo
              },
              orange: {
                accent: '#FC7206',     // Naranja de acento para la flecha y progresos
                light: '#FDA35D',      // Fondo suave para tarjetas de inspiración
              },
              gray: {
                sidebar: '#F1F3F9',    // Fondo de la sidebar izquierda
              }
            }
          },
          fontFamily: {
            sans: ['Archivo', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <script type="module" src="/src/main.js"></script>
</head>
<body class="app-shell flex flex-col h-screen bg-foco-blue-light font-sans overflow-hidden text-slate-800">

  <!-- 1. Componente: Header Superior -->
  <foco-header></foco-header>

  <!-- Contenedor del Cuerpo: Layout de 3 columnas de F.O.C.O. -->
  <div class="flex flex-1 overflow-hidden relative">
    
    <!-- 2. Componente: Barra de Acciones Rápidas (Sidebar Izquierda) -->
    <foco-sidebar-actions></foco-sidebar-actions>

    <!-- 3. Componente: Lienzo Central -->
    <foco-lienzo-canvas class="flex-1"></foco-lienzo-canvas>

    <!-- 4. Componente: Barra de Productividad (Sidebar Derecha - Colapsable) -->
    <foco-productivity-sidebar></foco-productivity-sidebar>

  </div>

</body>
</html>
