<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F.O.C.O. - Segundo Cerebro Visual</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Enlace a la hoja de estilos global -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Configuración oficial de Tailwind para F.O.C.O. -->
  <script src="tailwind.config.js"></script>

  <!-- Importación de componentes de Vanilla JS  -->
  <script src="src/components/Header.js" defer></script>
  <script src="src/components/SidebarActions.js" defer></script>
  <script type="module" src="src/components/LienzoCanvas.js" defer></script>
  <script src="src/components/ProductivitySidebar.js" defer></script>
</head>
<body class="flex flex-col h-screen bg-foco-blue-light font-sans overflow-hidden text-slate-800">

  <!-- 1. Componente: Header Superior -->
  <foco-header></foco-header>

  <!-- Contenedor del Cuerpo: Layout de 3 columnas de F.O.C.O. -->
  <div class="flex flex-1 overflow-hidden relative">
    
    <!-- 2. Componente: Barra de Acciones Rápidas (Sidebar Izquierda) -->
    <foco-sidebar-actions></foco-sidebar-actions>

    <!-- 3. Componente: Lienzo Central -->
    <foco-lienzo-canvas class="flex-1"></foco-lienzo-canvas>

    <!-- 4. Componente: Barra de Productividad (Sidebar Derecha - Colapsable) -->
    <foco-productivity-sidebar></foco-productivity-sidebar>

  </div>

</body>
</html>
